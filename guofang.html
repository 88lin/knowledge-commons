const STORE_KEY = 'dfquiz.v1';
let S = load();
function load(){
  try{
    const o = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    return {seen:o.seen||{}, wrong:o.wrong||[], hist:o.hist||[]};
  }catch(e){ return {seen:{}, wrong:[], hist:[]}; }
}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){} }

<script id="mainflow">
/* ---------- 基础工具 ---------- */
const Q = DATA.q;
const LETTERS = 'ABCDEFG';
const app = document.getElementById('app');
const topbar = document.getElementById('topbar');
const bar = document.getElementById('bar');
const barFill = document.getElementById('barFill');
const tbTitle = document.getElementById('tbTitle');
const tbCount = document.getElementById('tbCount');

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function fmtTime(ms){ const s=Math.round(ms/1000); return s<60 ? s+' 秒' : Math.floor(s/60)+' 分 '+(s%60)+' 秒'; }
function typeName(t){ return t==='s'?'单选题':t==='m'?'多选题':'判断题'; }
function typeTag(t){ return t==='s'?'<span class="tag">单选</span>':t==='m'?'<span class="tag m">多选</span>':'<span class="tag j">判断</span>'; }
function optsOf(q){ return q.t==='j' ? ['正确','错误'] : q.o; }
function ansText(q){
  if(q.t==='j') return q.a;
  if(q.t==='m') return q.a;
  const i = LETTERS.indexOf(q.a);
  return q.a + '、' + (q.o[i]||'').replace(/^[A-E]\s*[、.．]\s*/, '');
}

function setTop(show, title, count, pct){
  topbar.style.display = show ? 'flex' : 'none';
  bar.style.display = show ? 'block' : 'none';
  if(show){ tbTitle.textContent = title || ''; tbCount.textContent = count || ''; barFill.style.width = (pct||0)+'%'; }
}

/* ---------- 状态 ---------- */
let run = null;

/* ---------- 首页 ---------- */
function renderHome(){
  setTop(false);
  const keys = Object.keys(S.seen);
  let ok=0, tot=0, mastered=0;
  keys.forEach(k=>{ const v=S.seen[k]; ok+=v.r||0; tot+=(v.r||0)+(v.w||0); if((v.r||0)>0) mastered++; });
  const acc = tot ? Math.round(ok*100/tot) : 0;
  const wc = S.wrong.length;
  const cnt = {s:0,m:0,j:0};
  Q.forEach(q=>cnt[q.t]++);
  app.innerHTML = `
  <div class="wrap">
    <h1>国防教育 · 刷题</h1>
    <p class="sub">${Q.length} 题题库 · 随机抽题 · 答错自动进错题本</p>
    <div class="card statgrid">
      <div><b>${tot}</b><span>已答</span></div>
      <div><b>${acc}%</b><span>正确率</span></div>
      <div><b>${mastered}</b><span>已答对</span></div>
      <div><b style="color:${wc?'#dc2626':'inherit'}">${wc}</b><span>错题本</span></div>
    </div>
    <div class="sect">随机测试</div>
    <button class="btn" data-act="start" data-n="10">快速热身<em>10 题 · 约 3 分钟</em></button>
    <button class="btn" data-act="start" data-n="25">半场测验<em>25 题 · 约 8 分钟</em></button>
    <button class="btn dark" data-act="start" data-n="0">全真模拟<em>全部 ${Q.length} 题</em></button>
    <button class="btn warn" data-act="wrong" ${wc?'':'disabled'}>错题重练<em>${wc?wc+' 题在手':'暂无错题'}</em></button>
    <div class="sect">按题型练</div>
    <button class="btn ghost" data-act="type" data-t="s">单选专项<em>${cnt.s} 题</em></button>
    <button class="btn ghost" data-act="type" data-t="m">多选专项<em>${cnt.m} 题（最易错）</em></button>
    <button class="btn ghost" data-act="type" data-t="j">判断专项<em>${cnt.j} 题</em></button>
    <div class="sect">考前速览</div>
    <button class="btn ghost" data-act="list">答案速览<em>100 题 · 扫一遍再进考场</em></button>
    <div style="text-align:center;margin-top:16px">
      <a href="#" data-act="reset" style="color:#9ca3af;font-size:12.5px;text-decoration:none">清空本机记录</a>
    </div>
  </div>`;
}

/* ---------- 抽题 ---------- */
function pickPool(pool, n, preferWrong){
  const w = new Set(S.wrong);
  let out = [];
  if(preferWrong){
    const cand = pool.filter(i => w.has(i));
    shuffle(cand);
    out = cand.slice(0, Math.min(cand.length, Math.ceil(n*0.4)));
  }
  const rest = pool.filter(i => out.indexOf(i) < 0);
  shuffle(rest);
  while(out.length < n && rest.length) out.push(rest.pop());
  shuffle(out);
  return out;
}

function startQuiz(title, pool, n, preferWrong){
  const total = Math.min(n, pool.length);
  const list = pickPool(pool, total, preferWrong);
  run = { title, items: list.map(qi => ({qi, retry:0})), i:0, sel:[], locked:false,
          t0:Date.now(), firstTotal:0, firstOk:0, revealed:0, wrongThisRound:[] };
  renderQuiz();
}

/* ---------- 答题 ---------- */
function currentQ(){ return Q[run.items[run.i].qi]; }

function renderQuiz(){
  if(run.i >= run.items.length) return renderResult();
  const it = run.items[run.i];
  const q = currentQ();
  const opts = optsOf(q);
  const multi = q.t === 'm';
  setTop(true, run.title, (run.i+1)+' / '+run.items.length, run.i*100/run.items.length);
  app.innerHTML = `
  <div class="wrap" style="padding-top:16px">
    <div class="qtags">${typeTag(q.t)}
      ${it.retry?'<span class="tag" style="background:#fee2e2;color:#991b1b">重做</span>':''}
      <span class="tag idx">第 ${run.i+1} 题</span></div>
    <div class="stem">${esc(q.q)}</div>
    <div id="opts">${opts.map((o,i)=>`
      <button class="opt" data-opt="${esc(q.t==='j'?o:LETTERS[i])}">
        ${q.t==='j'?'':`<span class="k">${LETTERS[i]}</span>`}<span>${esc(o)}</span>
      </button>`).join('')}
    </div>
    <div id="fb"></div>
    ${multi?'<button class="btn" id="confirm" disabled>确认答案<em>可多选</em></button>':''}
    <button class="btn ghost" data-act="reveal" id="revealBtn">不会，直接看答案</button>
    <button class="btn dark" data-act="next" id="nextBtn" style="display:none">下一题</button>
  </div>`;
  run.sel = [];
  run.locked = false;
}

function paintOpts(chosen, q){
  const btns = document.querySelectorAll('#opts .opt');
  const correct = new Set(q.t==='j' ? [q.a] : q.a.split(''));
  btns.forEach(b => {
    const v = b.dataset.opt;
    b.disabled = true;
    if(correct.has(v)) b.classList.add('ok');
    else if(chosen.indexOf(v) >= 0) b.classList.add('bad');
    b.classList.toggle('sel', chosen.indexOf(v) >= 0 && correct.has(v));
  });
}

function grade(chosen, revealed){
  const it = run.items[run.i];
  const q = currentQ();
  const qi = it.qi;
  let ok, note = '';
  if(revealed){
    ok = false;
  } else if(q.t === 'm'){
    const s = chosen.slice().sort().join(''), a = q.a.split('').sort().join('');
    ok = s === a;
    if(!ok){
      const miss = q.a.split('').filter(c => chosen.indexOf(c) < 0);
      const over = chosen.filter(c => q.a.indexOf(c) < 0);
      const p = [];
      if(miss.length) p.push('漏选 ' + miss.join(''));
      if(over.length) p.push('多选 ' + over.join(''));
      note = p.join(' · ');
    }
  } else {
    ok = chosen[0] === q.a;
  }

  // 统计
  const v = S.seen[qi] || {r:0, w:0};
  if(it.retry === 0 && !revealed){
    run.firstTotal++;
    if(ok) run.firstOk++;
  }
  if(ok){
    v.r = (v.r||0) + 1;
    const k = S.wrong.indexOf(qi);
    if(k >= 0) S.wrong.splice(k, 1);
  } else {
    v.w = (v.w||0) + 1;
    if(S.wrong.indexOf(qi) < 0) S.wrong.push(qi);
    if(revealed) run.revealed++;
    else run.wrongThisRound.push(qi);
    if(it.retry === 0) run.items.push({qi, retry:1});   // 本轮末尾重做一次
  }
  S.seen[qi] = v;
  save();

  // 反馈
  paintOpts(chosen, q);
  const fb = document.getElementById('fb');
  if(ok){
    fb.innerHTML = `<div class="fb ok">✓ 答对了${it.retry?'<small>这题之前错了，这次记住了</small>':''}</div>`;
  } else {
    fb.innerHTML = `<div class="fb bad">${revealed?'答案在这里':'✗ 答错了'}
      <small>正确答案：${esc(ansText(q))}${note?'（'+note+'）':''}</small></div>`;
  }
  document.getElementById('revealBtn').style.display = 'none';
  const nx = document.getElementById('nextBtn');
  nx.style.display = 'block';
  nx.textContent = (run.i + 1 >= run.items.length) ? '看结果' : '下一题';
  const c = document.getElementById('confirm');
  if(c) c.style.display = 'none';
  run.locked = true;
  save();
}

/* ---------- 结果页 ---------- */
function renderResult(){
  setTop(true, run.title, '完成', 100);
  const used = Date.now() - run.t0;
  const acc = run.firstTotal ? Math.round(run.firstOk*100/run.firstTotal) : 0;
  const wrongs = run.wrongThisRound.slice();
  const color = acc >= 80 ? '#16a34a' : acc >= 60 ? '#d97706' : '#dc2626';
  const tip = acc >= 90 ? '稳了，明天正常发挥就行。' :
              acc >= 70 ? '基本盘可以，把下面几道错题再看两遍。' :
              acc >= 50 ? '还有漏洞，错题重练一轮再收工。' :
                          '先别做题了，把课本过一遍，回来再练。';
  app.innerHTML = `
  <div class="wrap" style="padding-top:16px">
    <div class="card result-hero">
      <div class="pct" style="color:${color}">${acc}%</div>
      <div class="lbl">本轮正确率 · 首次作答 ${run.firstOk}/${run.firstTotal} 题</div>
      <div class="lbl">用时 ${fmtTime(used)}${run.revealed?' · 直接看答案 '+run.revealed+' 题':''}</div>
    </div>
    <div class="card" style="padding:12px 14px;font-size:14.5px;color:#374151">${tip}</div>
    ${wrongs.length ? `<div class="sect">本轮错题（${wrongs.length}）</div>` + wrongs.map(qi=>{
      const q = Q[qi];
      return `<div class="wrongitem"><div class="q">${esc(q.q)}</div>
        <div class="a">答案：${esc(ansText(q))}</div></div>`;
    }).join('') : `<div class="card empty">本轮没有错题 🎯</div>`}
    ${wrongs.length ? '<button class="btn warn" data-act="redo">重练本轮错题<em>'+wrongs.length+' 题</em></button>' : ''}
    <button class="btn" data-act="start" data-n="10">再来 10 题随机</button>
    <button class="btn ghost" data-act="home">返回首页</button>
  </div>`;
}

/* ---------- 答案速览 ---------- */
function renderList(){
  setTop(true, '答案速览', Q.length + ' 题', 100);
  let h = '<div class="wrap" style="padding-top:14px">';
  ['s','m','j'].forEach(t => {
    h += '<div class="sect">' + typeName(t) + '</div>';
    let n = 0;
    Q.forEach(q => {
      if(q.t !== t) return;
      n++;
      h += '<div class="wrongitem" style="border-left-color:#2f6fed">' +
           '<div class="q">' + n + '. ' + esc(q.q) + '</div>' +
           (q.t === 'j' ? '' : q.o.map(o => '<div style="font-size:13.5px;color:#4b5563;padding-left:2px">' + esc(o) + '</div>').join('')) +
           '<div class="a">答案：' + esc(ansText(q)) + '</div></div>';
    });
  });
  h += '<button class="btn ghost" data-act="home">返回首页</button></div>';
  app.innerHTML = h;
}

/* ---------- 事件 ---------- */
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-opt],[data-act]');
  if(!btn) return;
  const act = btn.dataset.act;

  if(btn.dataset.opt !== undefined && !btn.dataset.act){
    if(!run || run.locked) return;
    const q = currentQ();
    if(q.t === 'm'){
      const v = btn.dataset.opt;
      const k = run.sel.indexOf(v);
      if(k >= 0){ run.sel.splice(k,1); btn.classList.remove('sel'); }
      else { run.sel.push(v); btn.classList.add('sel'); }
      document.getElementById('confirm').disabled = run.sel.length === 0;
      return;
    }
    run.sel = [btn.dataset.opt];
    grade(run.sel, false);
    return;
  }

  if(act === 'reveal'){ if(run && !run.locked){ run.sel = []; grade([], true); } return; }
  if(act === 'next'){
    run.i++;
    if(run.i >= run.items.length) renderResult(); else renderQuiz();
    return;
  }
  if(act === 'home'){ run = null; renderHome(); return; }
  if(act === 'redo'){
    const list = run.wrongThisRound.slice();
    run = null;
    startQuiz('错题重练', list, list.length, false);
    return;
  }
  if(act === 'start'){
    const n = parseInt(btn.dataset.n, 10);
    const all = Q.map((_,i)=>i);
    startQuiz(n ? '随机 '+n+' 题' : '全真模拟', all, n || Q.length, true);
    return;
  }
  if(act === 'type'){
    const t = btn.dataset.t;
    const pool = Q.map((_,i)=>i).filter(i => Q[i].t === t);
    startQuiz(typeName(t) + '专项', pool, pool.length, false);
    return;
  }
  if(act === 'wrong'){
    const pool = S.wrong.slice();
    if(!pool.length) return;
    startQuiz('错题重练', pool, pool.length, false);
    return;
  }
  if(act === 'list'){ run = null; renderList(); return; }
  if(act === 'reset'){
    if(confirm('清空本机的练习记录和错题本？')){
      S = {seen:{}, wrong:[], hist:[]}; save(); renderHome();
    }
    return;
  }
});

document.addEventListener('click', e => {
  if(e.target.closest('#confirm')){
    if(run && !run.locked && run.sel.length) grade(run.sel, false);
  }
}, true);

renderHome();

</script>
</body>
</html>
