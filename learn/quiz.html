/* ---- render ---- */
var BEST={};try{BEST=JSON.parse(localStorage.getItem('kc-quiz-best')||'{}')}catch(e){}
var chips=document.getElementById('chips'),stage=document.getElementById('stage'),cur=-1;
function saveBest(){try{localStorage.setItem('kc-quiz-best',JSON.stringify(BEST))}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function renderChips(){
  chips.innerHTML=QZ.map(function(L,i){
    var b=BEST[L.n]!=null?' <span class="best">最高 '+BEST[L.n]+'/5</span>':'';
    return '<span class="chip'+(i===cur?' on':'')+'" data-i="'+i+'">'+esc(L.t)+b+'</span>';}).join('');
  chips.querySelectorAll('.chip').forEach(function(c){c.onclick=function(){cur=+c.dataset.i;renderChips();run();};});
}
function run(){
  var L=QZ[cur],ans=[],done=0;
  function header(){
    stage.innerHTML='<div class="card2" id="qbox"></div>';
  }
  function draw(){
    var h='<div class="pbar"><i style="width:'+(done/5*100)+'%"></i></div><div class="qno">第 '+L.n+' 课 · '+esc(L.t)+'　'+done+'/5</div>';
    if(done>=5){
      var sc=ans.filter(Boolean).length;
      if(BEST[L.n]==null||sc>BEST[L.n]){BEST[L.n]=sc;saveBest();}
      var msg=sc===5?'全对！这一课你真的学会了。':sc>=4?'很稳——错的那题看一眼解析就补上了。':sc>=3?'及格边缘：回学堂把这课的视频再过一遍，重点看答错的考点。':'建议回学堂重学这一课，再来挑战。';
      h+='<div class="score">'+sc+' / 5</div><div class="smsg">'+msg+(BEST[L.n]===sc?'<br><span class="best">★ 新纪录已保存</span>':'')+'</div>'+
         '<div class="btnrow"><button class="act" id="redo">再测一次</button><button class="act ghost" id="goles">回学堂看课</button><button class="act ghost" id="oth">测其他课</button></div>';
      document.getElementById('qbox').innerHTML=h;
      document.getElementById('redo').onclick=function(){ans=[];done=0;draw();};
      document.getElementById('goles').onclick=function(){location.href='beginner.html';};
      document.getElementById('oth').onclick=function(){cur=-1;renderChips();stage.innerHTML='<div class="card2" style="text-align:center;color:#64748b">↑ 从上方选择一门课开始自测</div>';};
      renderChips();return;
    }
    var Q=L.qs[done];
    h+='<div class="qt">'+esc(Q.q)+'</div>';
    Q.o.forEach(function(o,i){h+='<button class="opt" data-i="'+i+'">'+esc(o)+'</button>';});
    h+='<div class="exp" id="exp"><b>解析：</b>'+esc(Q.e)+'</div>';
    var qb=document.getElementById('qbox');qb.innerHTML=h;
    qb.querySelectorAll('.opt').forEach(function(b){
      b.onclick=function(){
        if(done<ans.length)return; /* already answered */
        var pick=+b.dataset.i,ok=pick===Q.a;ans.push(ok);done++;
        qb.querySelectorAll('.opt').forEach(function(x,i){
          x.onclick=null;
          if(i===Q.a)x.classList.add('ok');
          else if(i===pick&&!ok)x.classList.add('bad');
        });
        document.getElementById('exp').classList.add('show');
        setTimeout(function(){
          if(done>=5){draw();}else{draw();}
        },1600);
      };
    });
  }
  header();draw();
}
renderChips();
/* 深链：quiz.html#05 直接进入第 05 课 */
(function(){
  var h=location.hash.replace('#','');
  if(/^(0[0-9]|1[0-5])$/.test(h)){
    var i=QZ.findIndex(function(L){return L.n===h;});
    if(i>=0){cur=i;renderChips();run();return;}
  }
})();
stage.innerHTML='<div class="card2" style="text-align:center;color:#64748b">↑ 从上方选择一门课开始自测（推荐顺序：从第 00 课开始）</div>';
</script>
